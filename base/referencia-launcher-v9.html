<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocruzta Hub</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/600.css">
<style>
/* ============ Tokens ============ */
:root{
  --bg:#0d0d0e; --surface:#141415; --surface-2:#1a1a1c; --hover:rgba(255,255,255,.045);
  --line:#252527; --line-strong:#333336;
  --text:#ececea; --text-2:#a3a3a0; --text-3:#6f6f6d;
  --brand:#3b82f6; --app:#3b82f6;
  --ok:#4cc38a; --warn:#e5a63b; --bad:#ec5d5d;
  --r-s:6px; --r-m:8px; --r-l:12px;
  --sans:"Inter",-apple-system,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
:root[data-theme="light"]{
  --bg:#f4f4f2; --surface:#ffffff; --surface-2:#f7f7f5; --hover:rgba(0,0,0,.045);
  --line:#e4e4e0; --line-strong:#d3d3ce;
  --text:#18181a; --text-2:#5f5f5c; --text-3:#9a9a96;
  --ok:#1f9d63; --warn:#b97d12; --bad:#d64545;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);font-size:13px;line-height:1.45;color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit;background:none;border:0;outline:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:var(--r-s)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
kbd{font-family:var(--mono);font-size:10.5px;color:var(--text-3);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:17px;background:var(--surface)}
#app{height:100%;display:flex;flex-direction:column}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none;display:inline-block}
.dot.w{background:var(--warn)}.dot.m{background:var(--text-3)}

/* ============ Title bar ============ */
#titlebar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;border-bottom:1px solid var(--line);position:relative;z-index:30}
.tb-l,.tb-r{display:flex;align-items:center;gap:8px}
.mark{width:22px;height:22px;border-radius:6px;background:var(--brand);color:#ffffff;display:grid;place-items:center;font-weight:600;font-size:13px;letter-spacing:-.04em}
.brand{font-weight:500;font-size:13px;letter-spacing:-.01em;padding:4px 6px;border-radius:var(--r-s)}
.brand:hover{background:var(--hover)}
.slash{color:var(--line-strong);font-size:16px;margin:0 -2px}
.switch{position:relative}
.sw-btn{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px 0 6px;border-radius:var(--r-m);border:1px solid transparent;transition:background .12s,border-color .12s}
.sw-btn:hover,.switch.open .sw-btn{background:var(--surface-2);border-color:var(--line)}
.sw-btn b{font-weight:500}
.sw-btn .chev{color:var(--text-3);width:14px;height:14px}
.glyph{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--c,var(--text-2));background:color-mix(in srgb,var(--c,#888) 13%,var(--surface-2));border:1px solid color-mix(in srgb,var(--c,#888) 26%,var(--line));flex:none}
.glyph svg{width:12px;height:12px}
.menu{position:absolute;top:34px;left:0;width:280px;padding:4px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.35);opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .12s,transform .12s}
.switch.open .menu{opacity:1;transform:none;pointer-events:auto}
.menu .eyebrow{padding:8px 8px 4px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:var(--r-s)}
.mi:hover,.mi:focus-visible{background:var(--hover);outline:0}
.mi.cur{background:var(--hover)}
.mi .t{flex:1;min-width:0}.mi .t small{display:block;color:var(--text-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px}
.tb-btn{width:30px;height:30px;border-radius:var(--r-s);display:grid;place-items:center;color:var(--text-3);position:relative}
.tb-btn:hover{background:var(--hover);color:var(--text)}
.pip{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 2px var(--bg)}
.win{width:40px}.win.x:hover{background:var(--bad);color:#fff}

/* ============ Views ============ */
#view{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:flex;animation:in .18s ease-out}
@keyframes in{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}*{transition:none!important}}
#status{height:26px;flex:none;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
#status span{display:flex;align-items:center;gap:6px}

/* ============ Sidebar (Hub + Termix) ============ */
.side{width:232px;flex:none;display:flex;flex-direction:column;padding:12px 8px 10px 10px;overflow-y:auto}
.s-head{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 8px}
.s-head svg{color:var(--text-3);width:15px;height:15px}
.side .eyebrow.grp{padding:14px 8px 5px}
.sub{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:var(--r-s);color:var(--text-2);position:relative}
.sub:hover{background:var(--hover);color:var(--text)}
.sub.act{background:var(--hover);color:var(--text)}
.sub.act::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--bar,var(--app))}
.sub>span:not(.glyph){flex:1}
.sub svg{width:15px;height:15px}
.sub .glyph{width:20px;height:20px;border-radius:5px;flex:none}.sub .glyph svg{width:11px;height:11px}
.cnt{font-family:var(--mono);font-size:10.5px;color:var(--text-3);font-style:normal}
.nb{font-family:var(--mono);font-size:10px;background:var(--brand);color:#ffffff;border-radius:999px;padding:0 6px;line-height:16px;font-weight:600}
.s-foot{margin-top:auto;padding-top:12px}
.me{display:flex;align-items:center;gap:9px;padding:8px;border-top:1px solid var(--line);margin-top:8px}
.me .t{flex:1;line-height:1.25}.me small{display:block;color:var(--text-3);font-size:11px}

/* ============ HUB ============ */
#v-hub{--bar:var(--brand)}
.hmain{flex:1;min-width:0;overflow-y:auto}
.page{max-width:1200px;margin:0 auto;padding:30px 36px 56px}
.p-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:22px}
.p-head h1{font-size:24px;font-weight:600;letter-spacing:-.025em;margin-top:6px}
.p-head p{color:var(--text-2);margin-top:4px}
.search{display:flex;align-items:center;gap:8px;height:34px;width:300px;border:1px solid var(--line-strong);border-radius:var(--r-m);background:var(--surface);padding:0 10px;color:var(--text-3)}
.search:focus-within{border-color:var(--brand)}
.search input{flex:1;color:var(--text)}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-t a,.link{font-size:12px;color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.sec-t a:hover,.link:hover{color:var(--text)}
.box{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.stack{display:flex;flex-direction:column;gap:26px}

/* capas geradas */
.cover{background:color-mix(in srgb,var(--c) 11%,var(--surface-2));color:var(--c);overflow:hidden;position:relative}
.cover svg{width:100%;height:100%;display:block;position:absolute;inset:0}
.cat{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2)}
.cat svg{width:13px;height:13px;color:var(--c)}

/* comunicados */
.ann{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.ann:last-child{border-bottom:0}
.ann .t{flex:1;min-width:0}
.ann h3{font-size:13.5px;font-weight:500;letter-spacing:-.005em;display:flex;align-items:center;gap:8px}
.ann p{color:var(--text-2);font-size:12.5px;margin-top:2px}
.ann .m{display:flex;gap:8px;align-items:center;color:var(--text-3);font-size:11.5px;margin-top:6px}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:0 6px;line-height:17px;border-radius:4px;border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.pinned{color:var(--brand);display:inline-flex}.pinned svg{width:12px;height:12px}

/* avatares */
.ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:11px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface-2));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));position:relative;flex:none}
.ava.l{width:56px;height:56px;font-size:18px}
.ava .st{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface);background:var(--text-3)}
.ava .st.on{background:var(--ok)}.ava .st.aw{background:var(--warn)}

/* início: lateral */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--r-l);overflow:hidden;border:1px solid var(--line)}
.tile{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--surface);transition:background .12s}
.tile:hover{background:var(--surface-2)}
.tile .glyph{width:30px;height:30px;border-radius:8px}.tile .glyph svg{width:15px;height:15px}
.tile b{font-weight:500;display:block;line-height:1.2}.tile small{color:var(--text-3);font-family:var(--mono);font-size:10px}
.grp-l{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
.grp-l:first-child{margin-top:0}
.person{display:flex;align-items:center;gap:11px;padding:9px 14px;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person .t{flex:1;min-width:0;line-height:1.25}.person small{color:var(--text-3);font-size:11.5px;display:block}
.ev{display:flex;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);align-items:center}
.ev:last-child{border-bottom:0}
.ev time{font-family:var(--mono);font-size:11px;color:var(--text-3);width:40px}
.ev .bar{width:2px;align-self:stretch;border-radius:2px;background:var(--c)}
.ev small{color:var(--text-3);display:block;font-size:11.5px}
.mini{display:grid;grid-template-columns:104px 1fr;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.mini:last-child{border-bottom:0}
.mini:hover{background:var(--hover)}
.mini .cover{aspect-ratio:3/2;border-radius:var(--r-m);border:1px solid var(--line)}
.mini h3{font-size:13.5px;font-weight:500;line-height:1.3;margin:4px 0}
.mini .m{color:var(--text-3);font-size:11.5px}

/* ============ NOTÍCIAS (blog) ============ */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border:1px solid var(--line);border-radius:999px;color:var(--text-2);background:var(--surface);transition:.12s}
.chip:hover{border-color:var(--line-strong);color:var(--text)}
.chip svg{width:14px;height:14px}
.chip em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.on em{color:inherit;opacity:.6}
.tools-row{display:flex;justify-content:space-between;align-items:center;margin:18px 0 18px;gap:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-m);padding:2px;background:var(--surface)}
.seg button{height:26px;padding:0 12px;border-radius:6px;color:var(--text-2);display:flex;align-items:center;gap:6px;font-size:12.5px}
.seg button.on{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-strong)}
.seg svg{width:13px;height:13px}
.hero{display:grid;grid-template-columns:1.15fr 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);margin-bottom:18px;cursor:pointer;transition:border-color .12s}
.hero:hover{border-color:var(--line-strong)}
.hero .cover{min-height:310px}
.hero .b{padding:26px 28px;display:flex;flex-direction:column}
.hero h2{font-size:25px;line-height:1.18;font-weight:600;letter-spacing:-.025em;margin:12px 0 10px}
.hero p{color:var(--text-2);font-size:14px;line-height:1.55}
.hero .f{margin-top:auto;padding-top:18px}
.n-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.a-card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);overflow:hidden;transition:border-color .12s,transform .12s;cursor:pointer}
.a-card:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.a-card .cover{aspect-ratio:2/1}
.a-card .b{padding:14px 16px 12px;display:flex;flex-direction:column;flex:1}
.a-card h3{font-size:15.5px;line-height:1.3;font-weight:600;letter-spacing:-.012em;margin:8px 0 6px}
.a-card p{color:var(--text-2);font-size:12.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;align-items:center;gap:8px;color:var(--text-3);font-size:11.5px;margin-top:auto;padding-top:12px}
.foot .sp{flex:1}
.bm{width:26px;height:26px;border-radius:var(--r-s);display:grid;place-items:center;color:var(--text-3)}
.bm:hover{background:var(--hover);color:var(--text)}
.bm.on{color:var(--brand)}.bm.on svg{fill:var(--brand)}
.bm svg{width:15px;height:15px}
.empty{padding:56px 0;text-align:center;color:var(--text-2);border:1px dashed var(--line-strong);border-radius:var(--r-l)}
.side-card{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);padding:14px 16px;margin-bottom:16px}
.trend{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.trend:last-child{border-bottom:0;padding-bottom:0}
.trend i{font-style:normal;font-family:var(--mono);font-size:18px;color:var(--text-3);width:22px;line-height:1.1}
.trend b{font-weight:500;font-size:13px;line-height:1.35;display:block}
.trend small{color:var(--text-3);font-size:11.5px}
.trend:hover b{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--text-2)}
.tag:hover{color:var(--text);border-color:var(--line-strong)}
.note{font-size:11.5px;color:var(--text-3);margin-top:6px}

/* ============ EQUIPE / COMUNICADOS ============ */
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mcard{padding:18px;display:flex;flex-direction:column;gap:14px}
.mcard .top{display:flex;gap:14px;align-items:center}
.mcard .ava .st{width:13px;height:13px;border-width:2.5px}
.mcard h3{font-size:15px;font-weight:600;letter-spacing:-.01em}
.mcard small{color:var(--text-3);display:block}
.mcard .row{display:flex;align-items:center;justify-content:space-between;color:var(--text-2);font-size:12.5px;padding-top:12px;border-top:1px solid var(--line)}
.mcard .acts{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:var(--r-m);border:1px solid var(--line-strong);background:var(--surface);font-weight:500;font-size:12.5px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn svg{width:14px;height:14px}
.compose{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:18px;color:var(--text-3)}
.compose span{flex:1}

/* ============ TERMIX ============ */
#v-termix{--app:#3b82f6;--bar:var(--app)}
.proj{margin-bottom:2px}
.p-row{display:flex;align-items:center;gap:9px;width:100%;padding:5px 8px;border-radius:var(--r-m)}
.p-row:hover{background:var(--hover)}
.av{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-weight:600;font-size:11px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent);flex:none}
.p-row b{font-weight:500;flex:1}
.p-row .chev{width:14px;height:14px;color:var(--text-3);transition:transform .15s}
.proj:not(.open) .p-row .chev{transform:rotate(-90deg)}
.subs{display:none;margin:1px 0 6px 19px;padding-left:9px;border-left:1px solid var(--line)}
.proj.open .subs{display:block}
.col{flex:1;min-width:0;display:flex;flex-direction:column;padding:8px 10px 0 0}
.panel{flex:1;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);display:flex;flex-direction:column;position:relative;overflow:hidden}
.tabs{height:40px;display:flex;justify-content:space-between;align-items:stretch;padding:0 8px;border-bottom:1px solid var(--line);flex:none}
.tabs-l{display:flex;align-items:stretch}
.tab{display:flex;align-items:center;gap:8px;padding:0 12px;position:relative;font-weight:500}
.tab::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--app);border-radius:2px 2px 0 0}
.tab .x{display:grid;place-items:center;width:16px;height:16px;border-radius:4px;color:var(--text-3)}
.tab .x:hover{background:var(--hover);color:var(--text)}
.tab .x svg{width:11px;height:11px}
.tabs-l .tb-btn{width:28px;height:28px;align-self:center}
.tabs-r{display:flex;align-items:center;gap:16px;color:var(--text-3);font-size:12px}
.tabs-r .w{display:flex;align-items:center;gap:7px;color:var(--text-2)}
.chat{flex:1;overflow-y:auto;padding:26px 0 8px}
.chat-in{width:min(660px,calc(100% - 140px));margin:0 auto}
.tool{display:flex;align-items:center;gap:10px;padding:7px 0;color:var(--text-2);font-size:12px}
.tool svg{width:14px;height:14px;color:var(--text-3)}
.tool b{font-weight:500;color:var(--text)}
.tool code{font-family:var(--mono);font-size:11.5px;color:var(--text-3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .ok{display:flex;align-items:center;gap:5px;color:var(--ok);font-size:11.5px}
.tool .ok svg{color:var(--ok);width:13px;height:13px}
.tools{border:1px solid var(--line);border-radius:var(--r-m);padding:2px 12px;margin-bottom:20px}
.tools .tool+.tool{border-top:1px solid var(--line)}
.msg{font-size:14px;line-height:1.65}
.msg p{margin-bottom:12px}
.msg h4{font-size:11px;font-family:var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-weight:400;margin:20px 0 8px}
.msg ul,.msg ol{padding-left:20px;margin-bottom:12px}.msg li{margin-bottom:6px;padding-left:2px}
.msg li::marker{color:var(--text-3)}
.msg code{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);padding:1px 5px;border-radius:5px}
.composer{width:min(660px,calc(100% - 140px));margin:0 auto 12px;flex:none}
.input{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:10px;padding:8px 8px 8px 14px}
.input:focus-within{border-color:var(--app)}
.input span{flex:1;font-size:13.5px}
.send{width:30px;height:30px;border-radius:7px;background:var(--app);color:#06101f;display:grid;place-items:center}
.send svg{width:15px;height:15px;stroke-width:2.2}

}
:root[data-theme="light"]{
  --surface:rgba(255,255,255,.66); --surface-2:rgba(255,255,255,.88);

}
html{background:#0a0c10}
body{background:transparent}
/* fundo: só tons de azul-marinho, bem baixos, para o vidro ficar neutro */
#wall{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(60% 55% at 6% 2%,rgba(59,130,246,.15) 0,transparent 70%),
  radial-gradient(55% 55% at 96% 6%,rgba(11,31,77,.70) 0,transparent 70%),
  radial-gradient(55% 60% at 90% 100%,rgba(30,58,138,.26) 0,transparent 70%),
  radial-gradient(50% 55% at 2% 100%,rgba(96,190,250,.07) 0,transparent 70%),#0a0c10}
:root[data-theme="light"] #wall{background:
  radial-gradient(60% 55% at 6% 2%,rgba(167,199,255,.55) 0,transparent 70%),
  radial-gradient(55% 55% at 96% 6%,rgba(230,238,255,.9) 0,transparent 70%),
  radial-gradient(55% 60% at 90% 100%,rgba(96,190,250,.22) 0,transparent 70%),
  radial-gradient(50% 55% at 2% 100%,rgba(59,130,246,.12) 0,transparent 70%),#eef2f8}
#app{position:relative;z-index:1}

#titlebar{background:transparent;border-bottom:0}
#status{background:transparent;border-top:0}
.pip{box-shadow:0 0 0 2px #14161b}
.sw-btn:hover,.switch.open .sw-btn{background:var(--surface-2)}
.logo,.mark{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%),var(--brand);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 8px rgba(59,130,246,.35)}

#view{padding:0 10px}
.view{inset:0 10px;gap:10px}
.side,.hmain,.panel,#v-soon{
  border:0;border-radius:18px;
  backdrop-filter:blur(40px) saturate(1.1);-webkit-backdrop-filter:blur(40px) saturate(1.1);
  box-shadow:inset 0 1px 0 var(--edge),0 0 0 .5px var(--line),var(--gshadow);
}
.side{background:var(--glass);width:236px;margin:0}
.hmain,.panel,#v-soon{background:var(--sheet)}
.col{padding:0}
.panel{margin:0}
.dock-in{background:var(--glass);backdrop-filter:blur(28px) saturate(1.1);-webkit-backdrop-filter:blur(28px) saturate(1.1);box-shadow:inset 0 1px 0 var(--edge),0 0 0 .5px var(--line),var(--gshadow);border:0}

.s-foot,.me{border-top-color:var(--line)}
.box,.side-card,.hero,.a-card,.mcard,.compose,.tools,.input,.empty,.app-list,.chip,.search,.seg{box-shadow:inset 0 1px 0 var(--edge)}

.nb{box-shadow:0 1px 6px rgba(59,130,246,.45)}

#app{height:calc(100% - 44px)}
.btn.pri{background:var(--brand);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 8px rgba(59,130,246,.35)}

#task{position:fixed;left:0;right:0;bottom:0;height:44px;z-index:9000;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(14,16,21,.80);backdrop-filter:blur(34px) saturate(1.2);-webkit-backdrop-filter:blur(34px) saturate(1.2);border-top:1px solid var(--line);color:var(--text-3);font-size:11.5px}

.tk.on{background:var(--surface-2)}

.tk .mark{width:24px;height:24px;font-size:13px}

.appwin{position:fixed;display:flex;flex-direction:column;border-radius:14px;background:color-mix(in srgb,var(--sheet) 90%,#000);backdrop-filter:blur(40px) saturate(1.2);-webkit-backdrop-filter:blur(40px) saturate(1.2);box-shadow:inset 0 1px 0 var(--edge),0 0 0 .5px var(--line-strong),0 30px 80px rgba(0,0,0,.55);overflow:hidden}

.wtb{height:40px;flex:none;display:flex;align-items:center;gap:10px;padding:0 4px 0 12px;user-select:none;cursor:default}

.wtb .wsub{color:var(--text-3);font-size:11.5px}
.wtb .sp{flex:1}
.wbody{flex:1;min-height:0;display:flex;gap:10px;padding:0 8px 8px;--app:#3b82f6;--bar:var(--brand)}
.wbody.c{align-items:center;justify-content:center;padding:0}
.wbody .side{width:220px}
.wbody .panel{border-radius:14px}

/* Em execução / lista de apps */
.rrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow .t{flex:1;min-width:0;line-height:1.3}.rrow small{display:block;color:var(--text-3);font-size:11.5px}
.rrow.idle{color:var(--text-2);padding:16px}
.arow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .glyph{width:42px;height:42px;border-radius:11px}.arow .glyph svg{width:20px;height:20px}
.arow .t{flex:1;min-width:0}
.arow b{font-weight:600;font-size:14.5px}
.arow .v{color:var(--text-3);font-size:12px;margin:0 8px 0 6px}
.arow p{color:var(--text-2);font-size:12.5px;margin:2px 0 3px}
.arow code{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.arow .sz{font-size:11px;color:var(--text-3);margin-left:8px}
.aact{display:flex;gap:8px;align-items:center}
.prog{width:240px}
.pb{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.pb i{display:block;height:100%;background:var(--brand);transition:width .18s}
.prog small{display:block;margin-top:6px;color:var(--text-2);font-size:11.5px;text-align:right}
#toast{position:fixed;left:50%;bottom:62px;transform:translate(-50%,10px);z-index:9500;padding:10px 16px;border-radius:12px;background:rgba(20,22,28,.9);color:#f3f4f6;font-size:12.5px;box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;backdrop-filter:blur(20px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ================= Capas geradas por categoria ================= */
function rng(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function art(cat, seed) {
  const r = rng(seed * 7919 + 13); let s = '';
  if (cat === 'IA') {
    const xs = [80, 200, 320], ys = [50, 100, 150, 200], pts = xs.map(x => ys.map(y => [x + (r() - .5) * 18, y + (r() - .5) * 14]));
    for (let c = 0; c < 2; c++) pts[c].forEach(a => pts[c + 1].forEach(b => { if (r() > .45) s += `<path d="M${a[0]} ${a[1]}L${b[0]} ${b[1]}" stroke="currentColor" stroke-opacity=".28" fill="none"/>`; }));
    pts.flat().forEach(p => s += `<circle cx="${p[0]}" cy="${p[1]}" r="${r() > .6 ? 8 : 5}" fill="currentColor" fill-opacity="${r() > .5 ? .95 : .45}"/>`);
  } else if (cat === 'Desenvolvimento') {
    for (let i = 0; i < 9; i++) { const ind = Math.floor(r() * 3) * 26, w = 40 + r() * 150; s += `<rect x="${50 + ind}" y="${34 + i * 21}" width="${w}" height="9" rx="4.5" fill="currentColor" fill-opacity="${.25 + r() * .6}"/><rect x="${24}" y="${34 + i * 21}" width="10" height="9" rx="4.5" fill="currentColor" fill-opacity=".2"/>`; }
  } else if (cat === 'Segurança') {
    for (let x = 0; x < 15; x++) for (let y = 0; y < 8; y++) s += `<circle cx="${28 + x * 25}" cy="${26 + y * 26}" r="1.8" fill="currentColor" fill-opacity=".28"/>`;
    s += `<circle cx="200" cy="120" r="64" fill="none" stroke="currentColor" stroke-width="2" stroke-opacity=".7"/><circle cx="200" cy="120" r="44" fill="none" stroke="currentColor" stroke-opacity=".35"/><circle cx="200" cy="112" r="11" fill="currentColor"/><rect x="195" y="116" width="10" height="26" rx="4" fill="currentColor"/>`;
  } else if (cat === 'Infra') {
    for (let i = 0; i < 3; i++) { const y = 42 + i * 58; s += `<rect x="70" y="${y}" width="260" height="44" rx="9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-opacity=".75"/><circle cx="96" cy="${y + 22}" r="5" fill="currentColor" fill-opacity="${.5 + r() * .5}"/><rect x="116" y="${y + 18}" width="${70 + r() * 100}" height="8" rx="4" fill="currentColor" fill-opacity=".3"/><rect x="290" y="${y + 18}" width="22" height="8" rx="4" fill="currentColor" fill-opacity=".6"/>`; }
  } else if (cat === 'Negócios') {
    let pts = '';
    for (let i = 0; i < 10; i++) { const h = 30 + i * 12 + r() * 36, x = 34 + i * 35; s += `<rect x="${x}" y="${210 - h}" width="22" height="${h}" rx="4" fill="currentColor" fill-opacity="${.22 + i * .07}"/>`; pts += `${x + 11},${204 - h - 14} `; }
    s += `<polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else if (cat === 'Design') {
    s += `<circle cx="150" cy="120" r="64" fill="currentColor" fill-opacity=".55"/><circle cx="230" cy="120" r="64" fill="none" stroke="currentColor" stroke-width="2"/><rect x="190" y="70" width="100" height="100" rx="14" transform="rotate(${Math.round(r() * 30 + 8)} 240 120)" fill="currentColor" fill-opacity=".2"/><path d="M60 200h280" stroke="currentColor" stroke-opacity=".3"/>`;
  } else if (cat === 'Marketing') {
    for (let i = 0; i < 16; i++) { const a = Math.PI * (i / 15) * .5, l = 90 + r() * 150; s += `<path d="M40 210L${40 + Math.cos(a) * l} ${210 - Math.sin(a) * l}" stroke="currentColor" stroke-width="${1 + r() * 2.4}" stroke-opacity="${.25 + r() * .6}" stroke-linecap="round"/>`; }
    s += `<circle cx="40" cy="210" r="18" fill="currentColor"/>`;
  } else {
    for (let i = 0; i < 4; i++) s += `<rect x="${110 + i * 22}" y="${46 + i * 22}" width="150" height="110" rx="14" fill="${i === 3 ? 'currentColor' : 'none'}" fill-opacity="${i === 3 ? .5 : 1}" stroke="currentColor" stroke-width="1.8" stroke-opacity="${.3 + i * .2}"/>`;
  }
  return s;
}
const cover = (n, cls='') => `<div class="cover ${cls}" style="--c:${CATS[n.cat].c}"><svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${art(n.cat, n.id)}</svg></div>`;

let hubSec = 'inicio';
function go(id, sec) {
  setOpen(false);
  if (sec) hubSec = sec;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  const cur = id === 'hub' ? HUB : appById(id);
  $('#cur-name').textContent = cur.name;
  $('#cur-g').style.setProperty('--c', cur.c);
  $('#cur-g').innerHTML = ic(cur.icon);
  menu.querySelectorAll('.mi').forEach(b => b.classList.toggle('cur', b.dataset.go === id));
  if (id === 'hub') { renderHub(); $('#v-hub').classList.add('on'); }
  else if (id === 'termix') $('#v-termix').classList.add('on');
  else { renderSoon(cur); $('#v-soon').classList.add('on'); }
  const SECN = { inicio:'Início', noticias:'Notícias', comunicados:'Comunicados', equipe:'Equipe' };
  $('#st-mid').textContent = id === 'hub' ? `Hub · ${SECN[hubSec]}` : `${cur.name} · v${cur.ver}`;
  history.replaceState(null, '', '#' + (id === 'hub' ? 'hub/' + hubSec : id));
}

/* ---- Notícias (blog) ---- */
function filteredNews() {
  const q = newsState.q.trim().toLowerCase();
  let l = NEWS.filter(n => (newsState.cat === 'Todas' || n.cat === newsState.cat) &&
    (!q || (n.t + n.x + n.cat + n.src + n.tags.join(' ')).toLowerCase().includes(q)));
  if (newsState.sort === 'alta') l = [...l].sort((a, b) => b.hot - a.hot);
  return l;
}
const card = n => `<article class="a-card"><div style="position:relative">${cover(n)}</div><div class="b">${catTag(n.cat)}<h3>${n.t}</h3><p>${n.x}</p>
  <div class="foot"><span>${n.src}</span><span>·</span><span>${n.ago}</span><span>·</span><span>${n.rd} min</span><span class="sp"></span>
  <button class="bm ${newsState.saved.has(n.id) ? 'on' : ''}" data-save="${n.id}" aria-label="Salvar" title="Salvar">${ic('bm')}</button></div></div></article>`;
function newsBody() {
  const l = filteredNews();
  if (!l.length) return `<div class="empty">Nenhuma notícia encontrada para este filtro.</div>`;
  const hero = newsState.cat === 'Todas' && !newsState.q && newsState.sort === 'recentes' ? l[0] : null;
  const rest = hero ? l.slice(1) : l;
  return (hero ? `<article class="hero">${cover(hero)}<div class="b">${catTag(hero.cat)}<h2>${hero.t}</h2><p>${hero.x}</p>
    <div class="foot f"><span>${hero.src}</span><span>·</span><span>${hero.ago}</span><span>·</span><span>${hero.rd} min de leitura</span><span class="sp"></span>
    <button class="bm ${newsState.saved.has(hero.id) ? 'on' : ''}" data-save="${hero.id}" aria-label="Salvar">${ic('bm')}</button></div></div></article>` : '') +
    `<div class="n-grid">${rest.map(card).join('')}</div>`;
}
function newsFilters() {
  const count = c => c === 'Todas' ? NEWS.length : NEWS.filter(n => n.cat === c).length;
  return `<div class="chips">${['Todas', ...Object.keys(CATS)].map(c => `<button class="chip ${newsState.cat === c ? 'on' : ''}" data-cat="${c}">${c !== 'Todas' ? ic(CATS[c].i) : ic('grid')}${c}<em>${count(c)}</em></button>`).join('')}</div>

function newsSide() {
  const saved = NEWS.filter(n => newsState.saved.has(n.id));
  return `<div class="side-card"><div class="sec-t"><span class="eyebrow">Em alta</span></div>
      ${[...NEWS].sort((a, b) => b.hot - a.hot).slice(0, 5).map((n, i) => `<div class="trend"><i>${i + 1}</i><div><b>${n.t}</b><small>${n.cat} · ${n.ago}</small></div></div>`).join('')}</div>
    <div class="side-card"><div class="sec-t"><span class="eyebrow">Tópicos</span></div><div class="tags">${TOPICS.map(t => `<button class="tag" data-tag="${t}">#${t}</button>`).join('')}</div></div>
    <div class="side-card"><div class="sec-t"><span class="eyebrow">Salvos</span><span class="cnt">${saved.length}</span></div>
      ${saved.length ? saved.map(n => `<div class="trend"><i style="font-size:13px;padding-top:2px">${ic('bm',14)}</i><div><b>${n.t}</b><small>${n.src}</small></div></div>`).join('') : '<div class="note">Nada salvo ainda.</div>'}</div>
    <div class="note">Seleção filtrada de tecnologia e negócios. Dados de exemplo; as notícias virão de uma API.</div>`;
}
function renderNewsParts() { $('#nf').innerHTML = newsFilters(); $('#nb').innerHTML = newsBody(); $('#ns').innerHTML = newsSide(); }
function pageNoticias(m) {
  m.innerHTML = `<div class="page">
    <div class="p-head"><div><div class="eyebrow">Biblioteca da equipe</div><h1>Notícias</h1><p>Tecnologia, segurança e negócios, filtrados para o que importa pra gente.</p></div>
      <label class="search">${ic('search')}<input id="nq" placeholder="Buscar notícias, fontes, tópicos…" value="${newsState.q}" autocomplete="off"></label></div>
    <div id="nf"></div>
    <div class="cols"><div id="nb"></div><aside id="ns"></aside></div></div>`;
  renderNewsParts();
  $('#nq').oninput = e => { newsState.q = e.target.value; $('#nf').innerHTML = newsFilters(); $('#nb').innerHTML = newsBody(); };
}

/* delegação de eventos do Hub */
$('#v-hub').addEventListener('click', e => {
  const t = e.target;
  const sec = t.closest('[data-sec]'); if (sec) return go('hub', sec.dataset.sec);
  const app = t.closest('[data-go]'); if (app) return go(app.dataset.go);
  const cat = t.closest('[data-cat]'); if (cat) { newsState.cat = cat.dataset.cat; return renderNewsParts(); }
  const sort = t.closest('[data-sort]'); if (sort) { newsState.sort = sort.dataset.sort; return renderNewsParts(); }
  const tag = t.closest('[data-tag]'); if (tag) { newsState.q = tag.dataset.tag; $('#nq').value = newsState.q; return renderNewsParts(); }
  const sv = t.closest('[data-save]'); if (sv) { const id = +sv.dataset.save; newsState.saved.has(id) ? newsState.saved.delete(id) : newsState.saved.add(id); return renderNewsParts(); }
});

/* ================= TERMIX (estrutura do print) ================= */
const sub = (n, l, c, act) => `<button class="sub ${act ? 'act' : ''}">${ic(n)}<span>${l}</span>${c ? `<em class="cnt">${c}</em>` : ''}</button>`;
const subs = `${sub('terminal','Terminais',1,1)}${sub('plug','Plugins')}${sub('spark','Skills')}${sub('net','MCPs')}`;
const proj = (l, name, c, open) => `<div class="proj ${open ? 'open' : ''}"><button class="p-row"><span class="av" style="--c:${c}">${l}</span><b>${name}</b>${ic('chev').replace('class="i"','class="i chev"')}</button><div class="subs">${subs}</div></div>`;
const tool = p => `<div class="tool">${ic('file')}<b>Read</b><code>${p}</code><span class="ok">${ic('check')}concluído</span></div>`;
const gauge = (lbl, val, color) => { const c = 88, d = c * val / 100; return `<div class="g" title="${lbl} ${val}%"><svg viewBox="0 0 36 36"><circle class="tr" cx="18" cy="18" r="14" fill="none" stroke-width="2.5"/><circle cx="18" cy="18" r="14" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${d} ${c}"/></svg><span class="v">${val}</span>${lbl}</div>`; };
$('#v-termix').innerHTML = `
<aside class="side">
  <div class="s-head"><span class="eyebrow">Projetos</span>${ic('panel')}</div>
  ${proj('H','Hyperframe','#3b82f6',false)}
  ${proj('T','Termix','#a3a3a0',true)}
  ${proj('R','Rocruzta Hub','#3b82f6',true)}
  <div class="s-foot">
    <button class="sub">${ic('plus')}<span>Novo projeto</span></button>
    <div class="eyebrow grp">Geral</div>
    <button class="sub">${ic('gauge')}<span>Consumo</span></button>
    <button class="sub">${ic('link')}<span>Integrações</span></button>
    <button class="sub">${ic('sliders')}<span>Configurações</span></button>
  </div>
</aside>
<div class="col">
  <div class="panel">
    <div class="tabs">
      <div class="tabs-l"><div class="tab"><i class="dot"></i>Claude 2<button class="x" aria-label="Fechar aba">${ic('x')}</button></div><button class="tb-btn" aria-label="Nova aba">${ic('plus',15)}</button></div>
      <div class="tabs-r"><span>Fechadas (1)</span><span class="w"><i class="dot w"></i>Aguardando você</span></div>
    </div>
    <div class="chat"><div class="chat-in">
      <div class="tools">${tool('pw-hub/termix.png')}${tool('pw-hub/store.png')}${tool('pw-hub/light.png')}</div>
      <div class="msg">
        <p>Retomei e rodei o mockup com o Playwright, em 1440×900. O console não registrou nenhum erro.</p>
        <h4>O que o mockup já tem</h4>
        <ul><li><b>Estrutura:</b> title bar custom, sidebar, abas e command palette.</li><li><b>Código:</b> o registro <code>apps</code> em <code>app.js</code> é a base para o modelo "um repo por app".</li></ul>
        <h4>Pontos para ajustar</h4>
        <ol><li><b>Tooltip do rail:</b> ele cobre itens da sidebar.</li><li><b>Início:</b> o 5º card fica sozinho numa segunda linha.</li></ol>
      </div>
    </div></div>
    <div class="composer">
      <div class="input"><span>ok agora vamos fazer com que ele refaça com base neste layout</span><button class="send" aria-label="Enviar">${ic('up')}</button></div>
      <div class="meta-row"><span>Este computador</span><span>Termix <span class="br">main</span></span><span class="sp"></span><span>Sonnet 5.5</span><span class="warn">⚠ bypass</span></div>
    </div>
    <div class="gauges">${gauge('CTX',9,'#a3a3a0')}${gauge('5H',11,'#4cc38a')}${gauge('7D',92,'#ec5d5d')}${gauge('CACHE',59,'#4cc38a')}</div>
  </div>
  <div class="dock"><div class="dock-in">
    <button class="act">${ic('terminal')}Terminais <span class="cnt">1</span></button>
    <button>${ic('globe')}Web</button><span class="vr"></span>
    <button>${ic('xc')}Clear</button><button>${ic('rot')}Reiniciar</button><button>${ic('terminal')}Terminal</button><span class="vr"></span>
    <button aria-label="Ajustes" style="padding:0 9px">${ic('sliders')}</button>
  </div></div>
</div>`;
document.querySelectorAll('#v-termix .p-row').forEach(r => r.onclick = () => r.parentElement.classList.toggle('open'));

/* ================= Demais apps ================= */
function renderSoon(a) {
  $('#v-soon').innerHTML = `<div class="soon">${glyph(a)}<h2>${a.name}</h2><p>${a.desc}.</p><div class="eyebrow">Ainda não desenhado</div><button class="btn" data-go="hub">${ic('home')}Voltar ao Hub <kbd>Esc</kbd></button></div>`;
  $('#v-soon').onclick = e => { if (e.target.closest('[data-go]')) go('hub'); };
}

const hs = location.hash.slice(1).split('/');
if (hs[0] === 'hub' && ['inicio','noticias','comunicados','equipe'].includes(hs[1])) hubSec = hs[1];
go(appById(hs[0]) ? hs[0] : 'hub');
</script>
<script>
/* ===== v9: modelo "instalador e lançador". Cada app roda em processo e janela próprios; o Hub só instala e abre. ===== */
(() => {
  const T = $('#v-termix').innerHTML;                       // interface do Termix, reaproveitada dentro da janela do app
  APPS[0].ver = '0.3.7';
  ANN[2].t = 'Termix 0.3.8 já está disponível';
  ANN[2].p = 'Melhora a leitura de consumo e a dock. Atualize pela tela de Apps.';
  const INIT = { termix:{ inst:true }, workflow:{ inst:true }, finanpro:{ inst:true }, instamidia:{ inst:true, latest:'0.5.0' }, lignum:{ inst:false }, rocstudio:{ inst:false } };
  APPS.forEach(a => Object.assign(a, { inst:INIT[a.id].inst, latest:INIT[a.id].latest || null, busy:null }));
  APPS[0].latest = '0.3.8';
  const SIZE = { termix:'148 MB', workflow:'62 MB', finanpro:'71 MB', instamidia:'88 MB', lignum:'54 MB', rocstudio:'210 MB' };
  const MEM  = { termix:'320 MB de memória', workflow:'140 MB de memória', finanpro:'160 MB de memória', instamidia:'190 MB de memória', lignum:'120 MB de memória', rocstudio:'410 MB de memória' };
  const wins = {}; let z = 10, focus = 'hub';

  SECTIONS.splice(1, 0, { id:'apps', l:'Apps', i:'grid', cnt:String(APPS.length) });

  /* ---------- toast ---------- */
  function toast(t) {
    let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
    el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2800);
  }

  /* ---------- menu do seletor ---------- */
  function buildMenu() {
    menu.innerHTML =
      `<button class="mi ${focus === 'hub' ? 'cur' : ''}" role="menuitem" data-go="hub">${glyph(HUB)}<span class="t">Hub<small>Central da empresa</small></span><kbd>0</kbd></button><hr>` +
      GROUPS.map(g => `<div class="eyebrow">${g}</div>` + APPS.filter(a => a.group === g).map(a =>
        `<button class="mi ${focus === a.id ? 'cur' : ''}" role="menuitem" data-go="${a.id}">${glyph(a)}<span class="t">${a.name}<small>${wins[a.id] ? 'Em execução' : a.inst ? a.desc : 'Não instalado'}</small></span>${wins[a.id] ? '<i class="dot"></i>' : ''}<kbd>${APPS.indexOf(a) + 1}</kbd></button>`).join('')).join('');
  }

  /* ---------- sidebar e páginas do Hub ---------- */
  hubSide = function () {
    return `<aside class="side">
      ${SECTIONS.map(s => `<button class="sub ${hubSec === s.id ? 'act' : ''}" data-sec="${s.id}">${ic(s.i)}<span>${s.l}</span>${s.nb ? `<b class="nb">${s.nb}</b>` : ''}${s.cnt ? `<em class="cnt">${s.cnt}</em>` : ''}</button>`).join('')}
      ${GROUPS.map(g => `<div class="eyebrow grp">${g}</div>` + APPS.filter(a => a.group === g).map(a =>
        `<button class="sub" data-go="${a.id}" style="${a.inst ? '' : 'opacity:.55'}">${glyph(a)}<span>${a.name}</span>${wins[a.id] ? '<i class="dot"></i>' : (!a.inst ? '<em class="cnt">instalar</em>' : '')}<kbd>${APPS.indexOf(a) + 1}</kbd></button>`).join('')).join('')}
      <div class="s-foot"><div class="me">${ava(TEAM[0])}<div class="t">Rodrigo Cruz<small>Online</small></div><button class="tb-btn" aria-label="Configurações" style="width:26px;height:26px">${ic('sliders', 15)}</button></div></div>
    </aside>`;
  };
  renderHub = function () {
    $('#v-hub').innerHTML = hubSide() + `<main class="hmain" id="hmain"></main>`;
    const m = $('#hmain');
    ({ inicio: pageInicio, apps: pageApps, noticias: pageNoticias, comunicados: pageComunicados, equipe: pageEquipe })[hubSec](m);
  };
  function softRender() {
    if (!$('#v-hub').classList.contains('on')) return;
    const st = $('#hmain') ? $('#hmain').scrollTop : 0; renderHub(); $('#hmain').scrollTop = st;
  }

  const runningBlock = () => {
    const ids = Object.keys(wins);
    const rows = ids.length ? ids.map(id => { const a = appById(id); return `<div class="rrow">${glyph(a)}<div class="t"><b>${a.name}</b><small>${wins[id].min ? 'Minimizado' : 'Aberto'}, janela própria, ${MEM[id]}</small></div><button class="btn" data-focus="${id}">Focar</button><button class="btn" data-stop="${id}">Encerrar</button></div>`; }).join('')
      : `<div class="rrow idle">Nenhum app aberto. Cada app abre em uma janela própria do Windows, e o Hub fica aberto para você alternar.</div>`;
    return `<section class="sec" style="margin-bottom:28px"><div class="sec-t"><span class="eyebrow">Em execução</span><span class="cnt">${ids.length}</span></div><div class="box">${rows}</div></section>`;
  };
  const _pageInicio = pageInicio;
  pageInicio = function (m) { _pageInicio(m); m.querySelector('.cols').insertAdjacentHTML('beforebegin', runningBlock()); };

  const appRow = a => {
    const run = !!wins[a.id]; let right;
    if (a.busy) right = `<div class="prog"><div class="pb"><i style="width:${a.busy.p}%"></i></div><small>${a.busy.label}, ${a.busy.p}%</small></div>`;
    else if (!a.inst) right = `<button class="btn pri" data-install="${a.id}">${ic('plus')}Instalar</button>`;
    else right = `${a.latest ? `<button class="btn" data-update="${a.id}">${ic('rot')}Atualizar</button>` : ''}<button class="btn ${a.latest ? '' : 'pri'}" data-go="${a.id}">${run ? 'Focar' : 'Abrir'}</button>${run ? `<button class="btn" data-stop="${a.id}">Encerrar</button>` : `<button class="btn" data-remove="${a.id}">Remover</button>`}`;
    return `<div class="arow">${glyph(a)}<div class="t"><b>${a.name}</b><span class="v">${a.inst ? 'v' + a.ver : 'não instalado'}</span>${run ? '<span class="pill" style="--c:#4cc38a">Em execução</span>' : ''}${a.inst && a.latest ? ` <span class="pill" style="--c:#e5a63b">Nova versão ${a.latest}</span>` : ''}<p>${a.desc}</p><code>github.com/rocruzta/app-${a.id}</code><span class="sz">${SIZE[a.id]}</span></div><div class="aact">${right}</div></div>`;
  };
  function pageApps(m) {
    m.innerHTML = `<div class="page"><div class="p-head"><div><div class="eyebrow">Biblioteca</div><h1>Apps</h1><p>Instale os apps da Rocruzta. Cada um vem de um repositório no GitHub e abre na própria janela.</p></div>
      <button class="btn" data-check>${ic('rot')}Buscar atualizações</button></div>
      ${GROUPS.map(g => `<div class="sec-t" style="margin-top:22px"><span class="eyebrow">${g}</span></div><div class="box">${APPS.filter(a => a.group === g).map(appRow).join('')}</div>`).join('')}
      <div class="note" style="margin:18px 0 0">Repositórios públicos por enquanto. Os pacotes ficam na pasta do usuário, sem precisar de administrador.</div></div>`;
  }

  /* ---------- instalar, atualizar, remover (simulação) ---------- */
  function work(id, label, done) {
    const a = appById(id); a.busy = { p:0, label }; softRender();
    const t = setInterval(() => {
      a.busy.p = Math.min(100, a.busy.p + Math.round(9 + Math.random() * 14));
      if (a.busy.p >= 100) { clearInterval(t); a.busy = null; done(a); updateUI(); } else softRender();
    }, 200);
  }

  /* ---------- janelas dos apps (simulam janelas separadas do Windows) ---------- */
  const soonHtml = a => `<div class="soon">${glyph(a)}<h2>${a.name}</h2><p>${a.desc}.</p><div class="eyebrow">Ainda não desenhado</div></div>`;
  function createWin(a) {
    const el = document.createElement('div'); el.className = 'appwin';
    const n = Object.keys(wins).length, W = Math.min(1060, innerWidth * .8), H = Math.min(700, (innerHeight - 44) * .84);
    el.style.cssText = `width:${W}px;height:${H}px;left:${(innerWidth - W) / 2 + n * 34}px;top:${((innerHeight - 44) - H) / 2 + n * 26}px`;
    el.innerHTML = `<div class="wtb">${glyph(a)}<b>${a.name}</b><span class="wsub">janela própria do Windows</span><span class="sp"></span>
      <button class="tb-btn win" data-w="min" aria-label="Minimizar">${ic('x', 0).replace('<path d="M18 6 6 18M6 6l12 12"/>', '<path d="M5 12h14"/>')}</button>
      <button class="tb-btn win" data-w="max" aria-label="Maximizar"><svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button>
      <button class="tb-btn win x" data-w="close" aria-label="Fechar">${ic('x')}</button></div>
      <div class="wbody ${a.id === 'termix' ? '' : 'c'}">${a.id === 'termix' ? T : soonHtml(a)}</div>`;
    document.body.appendChild(el);
    const w = { el, min:false, max:false };
    el.addEventListener('mousedown', () => focusWin(a.id));
    el.querySelector('.wtb').addEventListener('mousedown', e => {
      if (e.target.closest('button') || w.max) return;
      const r = el.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
      const mv = ev => { el.style.left = Math.max(-400, Math.min(innerWidth - 120, ev.clientX - dx)) + 'px'; el.style.top = Math.max(0, Math.min(innerHeight - 90, ev.clientY - dy)) + 'px'; };
      const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
      addEventListener('mousemove', mv); addEventListener('mouseup', up); e.preventDefault();
    });
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-w]'), pr = e.target.closest('.p-row');
      if (pr) pr.parentElement.classList.toggle('open');
      if (!b) return;
      if (b.dataset.w === 'close') closeWin(a.id);
      if (b.dataset.w === 'min') { w.min = true; el.style.display = 'none'; focusWin('hub'); }
      if (b.dataset.w === 'max') {
        w.max = !w.max;
        if (w.max) { w.prev = el.style.cssText; el.style.cssText += ';left:0;top:0;width:100vw;height:calc(100vh - 44px);border-radius:0'; }
        else el.style.cssText = w.prev;
      }
    });
    return w;
  }
  function focusWin(id) {
    if (id === 'hub') $('#app').style.zIndex = ++z;
    else { const w = wins[id]; if (!w) return; w.min = false; w.el.style.display = 'flex'; w.el.style.zIndex = ++z; }
    focus = id; renderTask(); buildMenu();
  }
  function closeWin(id) {
    const w = wins[id]; if (!w) return;
    w.el.remove(); delete wins[id]; toast(`${appById(id).name} encerrado`); focusWin('hub'); updateUI();
  }
  function openApp(id) {
    const a = appById(id);
    if (!a.inst) { toast(`${a.name} não está instalado. Instale na tela de Apps.`); hubSec = 'apps'; focusWin('hub'); go('hub', 'apps'); return; }
    if (a.busy) { toast(`${a.name} está sendo instalado, aguarde.`); return; }
    if (!wins[id]) { wins[id] = createWin(a); toast(`${a.name} aberto em uma janela própria`); }
    focusWin(id); updateUI();
  }

  /* ---------- barra de tarefas do Windows (simulação) ---------- */
  document.body.insertAdjacentHTML('beforeend', `<div id="task"><span>Área de trabalho do Windows (simulação)</span><div class="mid"></div><span id="clock"></span></div>`);
  const tick = () => { $('#clock').textContent = new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }); };
  tick(); setInterval(tick, 20000);
  function renderTask() {
    const ids = Object.keys(wins);
    $('#task .mid').innerHTML =
      `<button class="tk" title="Iniciar"><svg class="i" viewBox="0 0 24 24" style="fill:var(--brand);stroke:none;width:18px;height:18px"><rect x="3" y="3" width="8.5" height="8.5" rx="1"/><rect x="12.5" y="3" width="8.5" height="8.5" rx="1"/><rect x="3" y="12.5" width="8.5" height="8.5" rx="1"/><rect x="12.5" y="12.5" width="8.5" height="8.5" rx="1"/></svg></button>` +
      `<button class="tk ${focus === 'hub' ? 'on' : ''}" data-tk="hub" title="Rocruzta Hub"><span class="mark">R</span><i class="ind"></i></button>` +
      ids.map(id => { const a = appById(id); return `<button class="tk ${focus === id && !wins[id].min ? 'on' : ''}" data-tk="${id}" title="${a.name}">${glyph(a)}<i class="ind"></i></button>`; }).join('');
  }
  $('#task').addEventListener('click', e => {
    const b = e.target.closest('[data-tk]'); if (!b) return;
    const id = b.dataset.tk;
    if (id === 'hub') return focusWin('hub');
    const w = wins[id];
    if (focus === id && !w.min) { w.min = true; w.el.style.display = 'none'; focusWin('hub'); } else focusWin(id);
  });
  $('#app').addEventListener('mousedown', () => { if (focus !== 'hub') focusWin('hub'); }, true);

  /* ---------- ações dentro do Hub ---------- */
  $('#v-hub').addEventListener('click', e => {
    const t = e.target; let b;
    if ((b = t.closest('[data-install]'))) work(b.dataset.install, 'Baixando do GitHub', a => { a.inst = true; toast(`${a.name} instalado`); });
    else if ((b = t.closest('[data-update]'))) work(b.dataset.update, 'Atualizando do GitHub', a => { a.ver = a.latest; a.latest = null; toast(`${a.name} atualizado para ${a.ver}`); });
    else if ((b = t.closest('[data-remove]'))) { const a = appById(b.dataset.remove); a.inst = false; toast(`${a.name} removido`); updateUI(); }
    else if ((b = t.closest('[data-focus]'))) focusWin(b.dataset.focus);
    else if ((b = t.closest('[data-stop]'))) closeWin(b.dataset.stop);
    else if (t.closest('[data-check]')) toast('Tudo em dia, exceto o Termix e o Instamidia');
  });

  function updateUI() { buildMenu(); softRender(); renderTask(); }

  /* ---------- navegação: apps abrem janela, Hub volta ao foco ---------- */
  const _go = go;
  go = function (id, sec) {
    if (!id || id === 'hub') {
      _go('hub', sec);
      $('#st-mid').textContent = 'Hub, ' + ({ inicio:'Início', apps:'Apps', noticias:'Notícias', comunicados:'Comunicados', equipe:'Equipe' }[hubSec]);
      focusWin('hub'); return;
    }
    openApp(id);
  };

  go('hub');
  updateUI();
})();

</script>
</body>
</html>
